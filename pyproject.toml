[build-system]
requires = ["setuptools==75.3.2"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-quant-harness"
version = "0.1.0"
description = "Offline-first A-share quantitative research harness"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "numpy==2.0.2",
  "pyarrow==17.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.14.1",
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stock_quant = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["stock_quant"]
